<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAMESIR BATTERY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --font-retro: "Share Tech Mono", "Lucida Console", "Consolas", "Cascadia Mono", "Courier New", monospace;
    --p1: #22d3ee;
    --p1-2: #3b82f6;
    --p2: #f472b6;
    --p2-2: #a855f7;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --radius: 28px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  [data-theme="dark"] {
    --bg: #07080d;
    --bg-2: #0d1018;
    --glass: rgba(255,255,255,.035);
    --glass-2: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.14);
    --txt: #f4f6fb;
    --txt-2: #9aa3b5;
    --txt-3: #5d6578;
    --shadow: 0 30px 80px -30px rgba(0,0,0,.8);
    --glow-alpha: .55;
  }
  [data-theme="light"] {
    --bg: #eef1f7;
    --bg-2: #ffffff;
    --glass: rgba(255,255,255,.7);
    --glass-2: rgba(255,255,255,.95);
    --line: rgba(15,23,42,.08);
    --line-2: rgba(15,23,42,.14);
    --txt: #0d1220;
    --txt-2: #556074;
    --txt-3: #94a0b4;
    --shadow: 0 30px 70px -35px rgba(30,41,80,.35);
    --glow-alpha: .28;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-retro); text-transform: uppercase; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-retro);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--bg);
    color: var(--txt);
    overflow-x: hidden;
    transition: background .5s var(--ease), color .5s var(--ease);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---------- Ambient background ---------- */
  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .blob {
    position: absolute; width: 60vw; height: 60vw; border-radius: 50%;
    filter: blur(120px); opacity: var(--glow-alpha);
    transition: opacity .6s var(--ease);
  }
  .blob.b1 { background: radial-gradient(circle, var(--p1), transparent 65%); left: -18vw; top: -10vw; animation: drift 18s ease-in-out infinite; }
  .blob.b2 { background: radial-gradient(circle, var(--p2), transparent 65%); right: -18vw; bottom: -18vw; animation: drift 22s ease-in-out infinite reverse; }
  @keyframes drift { 50% { transform: translate(4vw, 3vw) scale(1.08); } }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    opacity: .5;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 40px 6px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px;
    background: conic-gradient(from 200deg, var(--p1), var(--p1-2), var(--p2-2), var(--p2), var(--p1));
    display: grid; place-items: center;
    box-shadow: 0 10px 30px -8px rgba(99,102,241,.6);
  }
  .brand-mark svg { width: 24px; height: 24px; }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .brand p { font-size: 12.5px; color: var(--txt-2); margin-top: 2px; }

  .top-right { display: flex; align-items: center; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(18px);
    font-size: 12.5px; font-weight: 600; color: var(--txt-2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(52,211,153,.7); animation: ping 2s infinite; }
  .dot.off { background: var(--warn); animation: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

  .theme-toggle {
    position: relative; display: flex; height: 38px; padding: 4px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px);
  }
  .theme-toggle button {
    position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
    width: 40px; border-radius: 999px; color: var(--txt-3);
    display: grid; place-items: center; transition: color .3s;
  }
  .theme-toggle button.active { color: var(--txt); }
  .theme-toggle .knob {
    position: absolute; top: 4px; left: 4px; width: 40px; height: 28px; border-radius: 999px;
    background: var(--glass-2); border: 1px solid var(--line-2);
    box-shadow: 0 4px 14px -4px rgba(0,0,0,.35);
    transition: transform .45s var(--ease);
  }
  [data-theme="light"] .theme-toggle .knob { transform: translateX(40px); }
  .theme-toggle svg { width: 16px; height: 16px; }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 26px;
    padding: 22px 40px 26px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  /* ---------- Player card ---------- */
  .player {
    --c1: var(--p1); --c2: var(--p1-2);
    position: relative; border-radius: var(--radius);
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(24px) saturate(140%);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color .4s var(--ease), transform .4s var(--ease), opacity .4s;
    animation: rise .8s var(--ease) both;
  }
  .player.p2 { --c1: var(--p2); --c2: var(--p2-2); animation-delay: .08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .player::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(140deg, color-mix(in srgb, var(--c1) 60%, transparent), transparent 40%, transparent 60%, color-mix(in srgb, var(--c2) 50%, transparent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: .7; pointer-events: none;
  }
  .player.offline { opacity: .72; }
  .player.offline::before { opacity: .15; }
  .player.active { transform: translateY(-3px); }

  .player-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 26px 0;
  }
  .p-id { display: flex; align-items: center; gap: 14px; }
  .p-num {
    font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.04em;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .p-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .p-sub { font-size: 12px; color: var(--txt-2); margin-top: 3px; }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: color-mix(in srgb, var(--ok) 14%, transparent);
    color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .status.resting {
    background: color-mix(in srgb, var(--p1) 14%, transparent);
    color: var(--p1); border-color: color-mix(in srgb, var(--p1) 30%, transparent);
  }
  .status.resting .dot { background: var(--p1); animation: none; }
  .status.sleeping {
    background: color-mix(in srgb, var(--warn) 14%, transparent);
    color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent);
  }
  .status.sleeping .dot { background: var(--warn); animation: none; }
  .status.off { background: var(--glass); color: var(--txt-3); border-color: var(--line); }
  .status.off .dot { background: var(--txt-3); animation: none; }

  /* Stage: controller + ring */
  .stage {
    position: relative; height: 330px; margin: 6px 18px 0;
    display: grid; place-items: center;
  }
  .stage-floor {
    position: absolute; bottom: 26px; left: 50%; width: 62%; height: 46px; transform: translateX(-50%);
    background: radial-gradient(ellipse, color-mix(in srgb, var(--c1) 45%, transparent), transparent 70%);
    filter: blur(14px); opacity: .7; transition: opacity .3s;
  }
  .ring { position: absolute; width: 300px; height: 300px; transform: rotate(-90deg); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c1) 55%, transparent)); }
  .ring circle { fill: none; stroke-linecap: round; }
  .ring .track { stroke: var(--line-2); stroke-width: 2.4; stroke-dasharray: 1 3.2; }
  .ring .seg { stroke-width: 3; transition: stroke-dashoffset 1s var(--ease), opacity .4s; }

  .controller-wrap {
    position: relative; width: 380px; height: 300px;
    display: grid; place-items: center;
    animation: float 6s ease-in-out infinite;
  }
  .player.p2 .controller-wrap { animation-delay: -3s; }
  @keyframes float { 50% { transform: translateY(-9px) rotate(-1deg); } }
  .controller-img {
    position: relative; width: 92%; height: auto;
    filter: drop-shadow(0 26px 28px rgba(0,0,0,.5));
    transition: filter .25s var(--ease), transform .25s var(--ease);
  }
  [data-theme="light"] .controller-img { filter: drop-shadow(0 26px 26px rgba(30,41,80,.28)); }
  .controller-disc {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--c1) 38%, transparent), transparent 68%);
    filter: blur(6px);
    transition: opacity .3s, transform .3s var(--ease);
  }
  [data-theme="light"] .controller-disc { opacity: .7; }
  .player.active .controller-disc { transform: scale(1.12); }
  .player.offline .controller-disc { opacity: .15; }
  .player.active .controller-img { transform: scale(1.03); filter: drop-shadow(0 0 26px color-mix(in srgb, var(--c1) 65%, transparent)) drop-shadow(0 26px 28px rgba(0,0,0,.45)); }
  .player.offline .controller-img { filter: grayscale(1) brightness(.6) drop-shadow(0 20px 20px rgba(0,0,0,.4)); }
  .player.vibrating .controller-wrap { animation: shake .09s linear infinite; }
  @keyframes shake { 25% { transform: translate(-2px, 1px) rotate(-.6deg); } 75% { transform: translate(2px, -1px) rotate(.6deg); } }

  /* Battery readout */
  .readout {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
    padding: 0 26px;
  }
  .big {
    font-size: 58px; font-weight: 700; letter-spacing: .02em; line-height: .95;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 22px color-mix(in srgb, var(--c1) 35%, transparent);
  }
  .big small { font-size: 26px; font-weight: 700; color: var(--txt-2); margin-left: 2px; letter-spacing: .02em; }
  .readout-label {
    font-size: 13px; color: var(--txt-2); font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px;
  }
  .retro-line {
    margin: 10px 26px 0;
    font-size: 14px;
    letter-spacing: .1em;
    color: var(--txt);
    opacity: .92;
  }
  .level-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 14px; font-weight: 700; font-size: 14px;
    background: color-mix(in srgb, var(--lvl, var(--ok)) 14%, transparent);
    color: var(--lvl, var(--ok));
    border: 1px solid color-mix(in srgb, var(--lvl, var(--ok)) 28%, transparent);
    white-space: nowrap;
  }
  .bars { display: flex; gap: 6px; margin: 18px 26px 0; }
  .bars span {
    flex: 1; height: 10px; border-radius: 999px; background: var(--line);
    transition: background .5s var(--ease), box-shadow .5s;
  }
  .bars span.on { background: var(--lvl, var(--ok)); box-shadow: 0 0 14px -2px var(--lvl, var(--ok)); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 26px 0; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    padding: 12px 13px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--line);
  }
  .stat-k { font-size: 10.5px; color: var(--txt-3); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .stat-v { font-size: 14.5px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-sub { font-size: 11px; color: var(--txt-2); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Live input */
  .inputs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 26px 0; }
  .key {
    min-width: 34px; height: 30px; padding: 0 9px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 700; color: var(--txt-3);
    background: var(--glass); border: 1px solid var(--line);
    transition: all .08s;
  }
  .key.on {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 6px 18px -4px color-mix(in srgb, var(--c1) 80%, transparent);
    transform: translateY(-1px);
  }
  .key[data-k="A"].on { background: #22c55e; box-shadow: 0 6px 18px -4px #22c55e; }
  .key[data-k="B"].on { background: #ef4444; box-shadow: 0 6px 18px -4px #ef4444; }
  .key[data-k="X"].on { background: #3b82f6; box-shadow: 0 6px 18px -4px #3b82f6; }
  .key[data-k="Y"].on { background: #eab308; box-shadow: 0 6px 18px -4px #eab308; }

  /* Actions */
  .actions { display: flex; gap: 10px; padding: 20px 26px 24px; }
  .btn {
    height: 46px; border-radius: 14px; border: 1px solid var(--line-2);
    background: var(--glass); color: var(--txt); cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 0 16px; transition: transform .2s var(--ease), box-shadow .3s, background .3s, opacity .3s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 17px; height: 17px; }
  .btn.primary {
    flex: 1; border: 0; color: #fff;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--c1) 90%, transparent);
  }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; bottom: 54px; right: 0; min-width: 220px;
    padding: 8px; border-radius: 16px;
    background: var(--bg-2); border: 1px solid var(--line-2);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(8px) scale(.98); pointer-events: none;
    transition: all .25s var(--ease); z-index: 10;
  }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu-title { font-size: 11px; color: var(--txt-3); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 6px 10px 8px; }
  .menu button {
    width: 100%; text-align: left; border: 0; background: none; color: var(--txt);
    font: inherit; font-size: 13px; font-weight: 600; padding: 10px 10px; border-radius: 10px; cursor: pointer;
    display: flex; justify-content: space-between;
  }
  .menu button:hover { background: var(--glass-2); }
  .menu button span { color: var(--txt-3); font-weight: 500; }

  footer {
    position: relative; z-index: 1; text-align: center;
    font-size: 12px; color: var(--txt-3); padding: 0 40px 22px;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 600;
    background: var(--bg-2); border: 1px solid var(--line-2); color: var(--txt);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
    opacity: 0; transition: all .35s var(--ease); z-index: 50; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="ambient">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="grid-bg"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 11h4M8 9v4"/><circle cx="15.5" cy="10.5" r=".6" fill="#fff"/><circle cx="17.5" cy="12.5" r=".6" fill="#fff"/><path d="M17.3 5H6.7a4 4 0 0 0-3.95 3.4L2 14.5A3 3 0 0 0 7.2 17l1.6-2h6.4l1.6 2a3 3 0 0 0 5.2-2.5l-.75-6.1A4 4 0 0 0 17.3 5z"/></svg>
      </div>
      <div>
        <h1>GameSir Battery Hub</h1>
        <p>Seus dois controles, lado a lado, em tempo real</p>
      </div>
    </div>
    <div class="top-right">
      <button class="chip" id="autostart-btn" onclick="toggleAutoStart()" style="cursor:pointer" title="Clique para ativar/desativar inicialização automática com o Windows">
        <span class="dot" id="autostart-dot"></span>
        <span id="autostart-text">2º Plano + Auto-Start: Ativo</span>
      </button>
      <div class="chip"><span class="dot" id="live-dot"></span><span id="live-text">Conectando…</span></div>
      <div class="theme-toggle" role="group" aria-label="Tema">
        <div class="knob"></div>
        <button id="t-dark" title="Escuro" onclick="setTheme('dark')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button id="t-light" title="Claro" onclick="setTheme('light')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </div>
  </header>

  <main id="players"></main>

  <footer id="footer">Pode fechar esta janela (X) tranquilo: o app continua na bandeja do Windows (perto do relógio) salvando a bateria a cada 2s sem nunca resetar sozinho.</footer>
  <div class="toast" id="toast"></div>

<template id="tpl">
  <article class="player">
    <div class="player-head">
      <div class="p-id">
        <div class="p-num">P1</div>
        <div>
          <div class="p-name">GameSir Nova Lite</div>
          <div class="p-sub">Receptor 2.4GHz · Slot XInput 1</div>
        </div>
      </div>
      <div class="status"><span class="dot"></span><span class="status-t">Conectado</span></div>
    </div>

    <div class="stage">
      <div class="stage-floor"></div>
      <svg class="ring" viewBox="0 0 120 120">
        <defs>
          <linearGradient class="ring-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" class="g1"/><stop offset="100%" class="g2"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="60" cy="60" r="54"/>
        <circle class="seg" cx="60" cy="60" r="54"/>
      </svg>
      <div class="controller-wrap">
        <div class="controller-disc"></div>
        <img class="controller-img" alt="Controle GameSir" draggable="false" />
      </div>
    </div>

    <div class="readout">
      <div>
        <div class="readout-label">REMAINING BATTERY</div>
        <div class="big"><span class="pct">--</span><small>%</small></div>
      </div>
      <div class="level-badge"><span class="lvl-t">—</span></div>
    </div>
    <div class="retro-line">REMAINING BATTERY: <span class="pct-inline">--%</span></div>
    <div class="bars"><span></span><span></span><span></span><span></span></div>

    <div class="stats">
      <div class="stat"><div class="stat-k">Autonomia</div><div class="stat-v s-auto">—</div><div class="stat-sub s-mah">600 / 600 mAh</div></div>
      <div class="stat"><div class="stat-k">Consumo Atual</div><div class="stat-v s-draw">—</div><div class="stat-sub s-mode">Aguardando</div></div>
      <div class="stat"><div class="stat-k">Tempo em Uso</div><div class="stat-v s-sess">—</div><div class="stat-sub s-sess-sub">Só conta jogando</div></div>
      <div class="stat"><div class="stat-k">Inatividade</div><div class="stat-v s-idle">—</div><div class="stat-sub s-trig">LT 0% · RT 0%</div></div>
    </div>

    <div class="inputs">
      <div class="key" data-k="A">A</div><div class="key" data-k="B">B</div>
      <div class="key" data-k="X">X</div><div class="key" data-k="Y">Y</div>
      <div class="key" data-k="LB">LB</div><div class="key" data-k="RB">RB</div>
      <div class="key" data-k="LT">LT</div><div class="key" data-k="RT">RT</div>
      <div class="key" data-k="↑">↑</div><div class="key" data-k="↓">↓</div>
      <div class="key" data-k="←">←</div><div class="key" data-k="→">→</div>
      <div class="key" data-k="L3">L3</div><div class="key" data-k="R3">R3</div>
    </div>

    <div class="actions">
      <button class="btn primary b-vib">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8v8M21 8v8"/></svg>
        Vibrar para identificar
      </button>
      <div class="menu-wrap">
        <button class="btn b-cal" title="Ajustar carga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M10 9l-2 3h4l-2 3"/></svg>
          Ajustar
        </button>
        <div class="menu">
          <div class="menu-title">Acabei de carregar até…</div>
          <button data-p="100">Carga completa <span>100%</span></button>
          <button data-p="75">Três quartos <span>75%</span></button>
          <button data-p="50">Metade <span>50%</span></button>
          <button data-p="25">Pouca carga <span>25%</span></button>
        </div>
      </div>
    </div>
  </article>
</template>

<script>
  /* ---------- Theme ---------- */
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('gs_theme', t);
    document.getElementById('t-dark').classList.toggle('active', t === 'dark');
    document.getElementById('t-light').classList.toggle('active', t === 'light');
  }
  setTheme(localStorage.getItem('gs_theme') || 'dark');

  /* ---------- Build cards ---------- */
  const CIRC = 2 * Math.PI * 54;
  const BTN = [
    [0x1000,'A'],[0x2000,'B'],[0x4000,'X'],[0x8000,'Y'],[0x0100,'LB'],[0x0200,'RB'],
    [0x0001,'↑'],[0x0002,'↓'],[0x0004,'←'],[0x0008,'→'],[0x0040,'L3'],[0x0080,'R3']
  ];
  const FALLBACK = (c) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f3d"/><stop offset="1" stop-color="#11141c"/></linearGradient></defs>
      <path d="M95 95h110c25 0 42 18 46 44l9 62c4 26-22 42-40 26l-26-25H106l-26 25c-18 16-44 0-40-26l9-62c4-26 21-44 46-44z" fill="url(#g)" stroke="#3a4152" stroke-width="2"/>
      <circle cx="105" cy="140" r="20" fill="#0b0d13"/><circle cx="105" cy="140" r="13" fill="#2b3040"/>
      <circle cx="180" cy="180" r="20" fill="#0b0d13"/><circle cx="180" cy="180" r="13" fill="#2b3040"/>
      <circle cx="150" cy="118" r="8" fill="${c}"/>
      <circle cx="200" cy="125" r="7" fill="#eab308"/><circle cx="200" cy="155" r="7" fill="#22c55e"/>
      <circle cx="185" cy="140" r="7" fill="#3b82f6"/><circle cx="215" cy="140" r="7" fill="#ef4444"/>
      <path d="M128 172h10v-10h10v10h10v10h-10v10h-10v-10h-10z" fill="#0b0d13"/>
    </svg>`);

  const root = document.getElementById('players');
  const tpl = document.getElementById('tpl');
  const cards = [0, 1].map(slot => {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.classList.add(slot === 0 ? 'p1' : 'p2');
    el.querySelector('.p-num').textContent = 'P' + (slot + 1);
    el.querySelector('.p-sub').textContent = 'Receptor 2.4GHz · Slot XInput ' + (slot + 1);

    const gid = 'rg' + slot;
    const grad = el.querySelector('.ring-grad');
    grad.id = gid;
    grad.querySelector('.g1').setAttribute('stop-color', slot === 0 ? '#22d3ee' : '#f472b6');
    grad.querySelector('.g2').setAttribute('stop-color', slot === 0 ? '#3b82f6' : '#a855f7');
    const seg = el.querySelector('.seg');
    seg.setAttribute('stroke', `url(#${gid})`);
    seg.style.strokeDasharray = CIRC;
    seg.style.strokeDashoffset = CIRC;

    const img = el.querySelector('.controller-img');
    img.src = `/img/p${slot + 1}.png`;
    img.onerror = () => { img.onerror = null; img.src = FALLBACK(slot === 0 ? '#22d3ee' : '#f472b6'); };

    el.querySelector('.b-vib').onclick = () => vibrate(slot);
    const menu = el.querySelector('.menu');
    el.querySelector('.b-cal').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('open'); };
    menu.querySelectorAll('button').forEach(b => b.onclick = () => {
      menu.classList.remove('open');
      setBattery(slot, +b.dataset.p);
    });

    root.appendChild(el);
    return {
      el, seg,
      nameEl: el.querySelector('.p-name'),
      subEl: el.querySelector('.p-sub'),
      pct: el.querySelector('.pct'),
      pctInline: el.querySelector('.pct-inline'),
      lvl: el.querySelector('.level-badge'),
      lvlT: el.querySelector('.lvl-t'),
      bars: el.querySelectorAll('.bars span'),
      status: el.querySelector('.status'),
      statusT: el.querySelector('.status-t'),
      auto: el.querySelector('.s-auto'),
      mah: el.querySelector('.s-mah'),
      draw: el.querySelector('.s-draw'),
      mode: el.querySelector('.s-mode'),
      sess: el.querySelector('.s-sess'),
      sessSub: el.querySelector('.s-sess-sub'),
      idle: el.querySelector('.s-idle'),
      trig: el.querySelector('.s-trig'),
      keys: Object.fromEntries([...el.querySelectorAll('.key')].map(k => [k.dataset.k, k])),
      vib: el.querySelector('.b-vib'),
      shownPct: -1,
      lastPacket: 0,
      activeUntil: 0
    };
  });
  document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')));

  /* ---------- Render ---------- */
  function levelInfo(pct) {
    if (pct >= 70) return ['Carga alta', 'var(--ok)', 4];
    if (pct >= 45) return ['Carga média', 'var(--ok)', 3];
    if (pct >= 20) return ['Carga baixa', 'var(--warn)', 2];
    return ['Recarregue', 'var(--bad)', 1];
  }
  function fmtTime(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function animateNumber(card, target, exactVal) {
    const fmt = (v) => {
      if (v >= 99.95) return '100';
      return v.toFixed(1).replace('.', ',');
    };
    if (card.shownPct < 0) {
      card.shownPct = exactVal;
      card.pct.textContent = fmt(exactVal);
      return;
    }
    if (Math.abs(card.shownPct - exactVal) < 0.05) {
      card.pct.textContent = fmt(exactVal);
      return;
    }
    const from = card.shownPct, t0 = performance.now();
    card.shownPct = exactVal;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 500), e = 1 - Math.pow(1 - k, 3);
      const cur = from + (exactVal - from) * e;
      card.pct.textContent = fmt(cur);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function render(card, c) {
    const on = c.connected;
    const now = performance.now();
    const moving = c.buttons || c.leftTrigger > 20 || c.rightTrigger > 20 ||
      Math.abs(c.thumbLX) > 7000 || Math.abs(c.thumbLY) > 7000 || Math.abs(c.thumbRX) > 7000 || Math.abs(c.thumbRY) > 7000;
    if (on && moving) card.activeUntil = now + 350;

    const state = c.activityState || (on ? 'Em Uso' : 'Desligado');
    const isResting = on && state === 'Em Repouso';
    const isSleeping = on && state === 'Hibernando';

    card.el.classList.toggle('offline', !on);
    card.el.classList.toggle('active', on && now < card.activeUntil);
    card.status.className = 'status' + (!on ? ' off' : isSleeping ? ' sleeping' : isResting ? ' resting' : '');
    card.statusT.textContent = !on ? 'Desligado (Salvo)' : isSleeping ? 'Hibernando (0 mA)' : isResting ? 'Em Repouso' : state;
    card.vib.disabled = !on;
    if (c.modelName) card.nameEl.textContent = c.modelName;
    if (c.connectionSubtitle) card.subEl.textContent = c.connectionSubtitle;

    // Even if controller is turned off, always display its last saved battery state!
    const exactPct = typeof c.batteryPercentExact === 'number' ? c.batteryPercentExact : (c.batteryPercent ?? 100);
    const pct = c.batteryPercent ?? Math.floor(exactPct);
    const [label, color, cells] = levelInfo(pct);
    card.el.style.setProperty('--lvl', on ? color : 'var(--txt-2)');
    card.lvlT.textContent = on ? label : `${label} (Último estado)`;
    card.bars.forEach((b, i) => b.classList.toggle('on', i < cells));
    card.seg.style.strokeDashoffset = CIRC * (1 - exactPct / 100);

    animateNumber(card, pct, exactPct);
    if (card.pctInline) {
      card.pctInline.textContent = (exactPct >= 99.95 ? '100' : exactPct.toFixed(1).replace('.', ',')) + '%';
    }

    const remMah = c.remainingMah ?? Math.round((exactPct / 100) * 600);
    // Autonomy in gameplay (~75mA average active draw)
    const estPlayHrs = remMah / 75;
    card.auto.textContent = `~${Math.floor(estPlayHrs)}h ${String(Math.round((estPlayHrs % 1) * 60)).padStart(2,'0')}m`;
    card.mah.textContent = `${remMah} / 600 mAh`;

    const ma = on ? (c.currentDrawMa ?? 11) : 0;
    card.draw.textContent = `${ma} mA`;
    card.mode.textContent = !on ? 'Desligado (0%/h)' : isSleeping ? 'Auto-Sleep (0%/h)' : isResting ? 'Standby (~1.8%/h)' : 'Jogando (~12%/h)';

    card.sess.textContent = fmtTime(c.sessionSeconds || 0);
    card.sessSub.textContent = !on ? 'Salvo na memória' : (isResting || isSleeping) ? 'Pausado (parado)' : 'Contando em uso';

    const idleSec = c.idleSeconds || 0;
    card.idle.textContent = !on ? 'Controle desligado' : idleSec < 12 ? 'Ativo agora' : fmtTime(idleSec);
    const lt = Math.round(c.leftTrigger / 2.55), rt = Math.round(c.rightTrigger / 2.55);
    card.trig.textContent = on ? `LT ${lt}% · RT ${rt}%` : 'Sem consumo (0 mA)';

    for (const [mask, k] of BTN) card.keys[k].classList.toggle('on', on && (c.buttons & mask) !== 0);
    card.keys.LT.classList.toggle('on', on && c.leftTrigger > 20);
    card.keys.RT.classList.toggle('on', on && c.rightTrigger > 20);
  }

  let fails = 0;
  async function tick() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const d = await r.json();
      d.controllers.forEach(c => cards[c.slot] && render(cards[c.slot], c));
      const n = d.controllers.filter(c => c.connected).length;
      document.getElementById('live-dot').classList.remove('off');
      document.getElementById('live-text').textContent = n === 2 ? 'Dois controles ativos' : n === 1 ? 'Um controle ativo' : 'Salvo na memória (Standby)';
      const asDot = document.getElementById('autostart-dot');
      const asTxt = document.getElementById('autostart-text');
      if (asDot && asTxt && typeof d.autoStart === 'boolean') {
        asDot.classList.toggle('off', !d.autoStart);
        asTxt.textContent = d.autoStart ? '2º Plano + Auto-Start: Ativo' : '2º Plano Ativo (Auto-Start Off)';
      }
      fails = 0;
    } catch {
      if (++fails > 3) {
        document.getElementById('live-dot').classList.add('off');
        document.getElementById('live-text').textContent = 'Serviço offline — abra o GameSirMonitor.exe';
      }
    }
  }
  tick();
  setInterval(tick, 120);

  /* ---------- Actions ---------- */
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  async function vibrate(slot) {
    const el = cards[slot].el;
    el.classList.add('vibrating');
    setTimeout(() => el.classList.remove('vibrating'), 650);
    fetch(`/api/vibrate?slot=${slot}`, { method: 'POST' }).catch(() => {});
    toast(`Controle P${slot + 1} vibrando 📳`);
  }
  async function setBattery(slot, p) {
    await fetch(`/api/set-battery?slot=${slot}&percent=${p}`, { method: 'POST' }).catch(() => {});
    toast(`P${slot + 1} ajustado para ${p}% (salvo em disco)`);
  }
  async function toggleAutoStart() {
    try {
      const r = await fetch('/api/toggle-autostart', { method: 'POST' });
      const d = await r.json();
      toast(d.autoStart ? 'Iniciar com o Windows: ATIVADO ✅' : 'Iniciar com o Windows: DESATIVADO');
      tick();
    } catch {}
  }
</script>
</body>
</html>
